# Debezium Server: lê o slot lógico do PostgreSQL e publica no Redpanda.
# Senha e endereços podem ser sobrescritos por variáveis de ambiente
# (ex.: DEBEZIUM_SOURCE_DATABASE_PASSWORD), convenção do Quarkus.

# ── Destino: Redpanda (API Kafka) ─────────────────────────────
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=redpanda:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Pelo menos uma vez: o produtor espera a confirmação de todas as réplicas.
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.enable.idempotence=true

# ── Origem: PostgreSQL ─────────────────────────────────────
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.password=debezium
debezium.source.database.dbname=leitos
debezium.source.topic.prefix=leitos
debezium.source.plugin.name=pgoutput
# A publicação é criada pela migração 0007. O slot é criado pelo Debezium na
# primeira vez que sobe: um slot criado na migração, sem consumidor, reteria
# o WAL indefinidamente em quem só usa a E1.
debezium.source.publication.name=leitos_cdc
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=leitos_cdc
debezium.source.table.include.list=public.carga,public.estabelecimento,public.estabelecimento_versao,public.leito,public.internacao
# Primeiro sobe com um snapshot das tabelas e depois segue o WAL.
debezium.source.snapshot.mode=initial
debezium.source.decimal.handling.mode=string
debezium.source.tombstones.on.delete=false

# Posição já lida no WAL, guardada em volume para sobreviver a reinícios.
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=5000

# ── Formato das mensagens ────────────────────────────────────
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

quarkus.log.level=INFO
quarkus.log.console.json=false
