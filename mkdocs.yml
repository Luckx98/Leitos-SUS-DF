site_name: Leitos SUS-DF
site_description: Plataforma de dados sobre ocupação de leitos SUS no DF (Banco de Dados 2, UnB)
site_url: https://luckx98.github.io/Leitos-SUS-DF/
repo_url: https://github.com/Luckx98/Leitos-SUS-DF
repo_name: Luckx98/Leitos-SUS-DF
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  favicon: favicon.svg
  palette:
    primary: green
    accent: amber
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables

nav:
  - Início: index.md
  - Entrega 1:
      - Visão da entrega: e1/index.md
      - Domínio e pergunta: e1/01-dominio-e-pergunta.md
      - Esquema e migrações: e1/02-esquema-e-migracoes.md
      - Carga reproduzível: e1/03-carga-reprodutivel.md
      - Volume: e1/04-volume.md
      - Caracterização da carga: e1/05-caracterizacao-da-carga.md
      - Histórico da origem: e1/06-historico-da-origem.md
      - ADR 0001: adr/0001-origem-insert-only-versionada-por-competencia.md
  - Entrega 2:
      - Visão da entrega: e2/index.md
      - Lote incremental: e2/01-lote-incremental.md
      - CDC: e2/02-cdc.md
      - Formato aberto: e2/03-formato-aberto.md
      - Semântica de entrega: e2/04-semantica-de-entrega.md
      - Dado atrasado: e2/05-dado-atrasado.md
      - Serialização e compressão: e2/06-serializacao-e-compressao.md
      - ADR 0002: adr/0002-lote-incremental-e-cdc-sobre-iceberg.md
  - Diário:
      - Semana de 05/10: diario/2026-10-05.md
