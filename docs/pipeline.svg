<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <pattern id="pontos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#dcdcdc"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="1300" height="480" rx="18" fill="url(#pontos)"/>
  <rect x="10" y="10" width="1300" height="480" rx="18" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- fontes (SIH/SUS, CNES, auxiliares) -->
  <g>
    <rect x="40" y="70" width="150" height="56" rx="10" fill="#ffffff" stroke="#0c3b2b" stroke-width="2"/>
    <rect x="40" y="160" width="150" height="56" rx="10" fill="#ffffff" stroke="#0c3b2b" stroke-width="2"/>
    <rect x="40" y="250" width="150" height="56" rx="10" fill="#ffffff" stroke="#0c3b2b" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="115" y="94" font-size="14" font-weight="700" fill="#1a1a1a">SIH/SUS</text>
    <text x="115" y="111" font-size="10.5" fill="#6b6b6b">internações (RD)</text>
    <text x="115" y="184" font-size="14" font-weight="700" fill="#1a1a1a">CNES</text>
    <text x="115" y="201" font-size="10.5" fill="#6b6b6b">estabelecimentos, leitos</text>
    <text x="115" y="274" font-size="14" font-weight="700" fill="#1a1a1a">Auxiliares</text>
    <text x="115" y="291" font-size="10.5" fill="#6b6b6b">CID-10, municípios</text>
  </g>

  <!-- carga -->
  <rect x="260" y="152" width="120" height="64" rx="10" fill="#ffffff" stroke="#0c3b2b" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="320" y="180" font-size="14" font-weight="700" fill="#1a1a1a">CARGA</text>
    <text x="320" y="198" font-size="10.5" fill="#6b6b6b">loader Python</text>
  </g>

  <!-- migrações -->
  <rect x="460" y="40" width="150" height="48" rx="10" fill="#ffffff" stroke="#0c3b2b" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="535" y="60" font-size="13" font-weight="700" fill="#1a1a1a">MIGRAÇÕES</text>
    <text x="535" y="77" font-size="10.5" fill="#6b6b6b">6 versões (Alembic)</text>
  </g>

  <!-- origem (E1) -->
  <rect x="430" y="100" width="280" height="240" rx="12" fill="#0c3b2b"/>
  <g fill="#f6f1e6">
    <text x="460" y="138" font-size="19" font-weight="700">ORIGEM</text>
    <text x="460" y="160" font-size="12" font-style="italic" opacity="0.85">insert-only, por competência</text>
    <g font-size="12.5" opacity="0.95">
      <text x="460" y="190">• PostgreSQL insert-only</text>
      <text x="460" y="216">• wal_level=logical</text>
      <text x="460" y="242">• carga idempotente (sha256)</text>
      <text x="460" y="268">• 3,73M internações</text>
    </g>
  </g>

  <!-- lote e cdc (E2) -->
  <rect x="800" y="90" width="150" height="70" rx="10" fill="#ffffff" stroke="#8a4b08" stroke-width="2"/>
  <rect x="800" y="280" width="150" height="70" rx="10" fill="#ffffff" stroke="#8a4b08" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="875" y="116" font-size="14" font-weight="700" fill="#1a1a1a">LOTE</text>
    <text x="875" y="134" font-size="10.5" fill="#6b6b6b">incremental</text>
    <text x="875" y="150" font-size="10.5" fill="#6b6b6b">watermark</text>
    <text x="875" y="306" font-size="14" font-weight="700" fill="#1a1a1a">CDC</text>
    <text x="875" y="324" font-size="10.5" fill="#6b6b6b">Debezium</text>
    <text x="875" y="340" font-size="10.5" fill="#6b6b6b">Redpanda</text>
  </g>

  <!-- lakehouse (E2) -->
  <rect x="1000" y="100" width="280" height="240" rx="12" fill="#8a4b08"/>
  <g fill="#f6f1e6">
    <text x="1030" y="138" font-size="19" font-weight="700">LAKEHOUSE</text>
    <text x="1030" y="160" font-size="11.5" font-style="italic" opacity="0.85">lote.* e cdc.*, reconciliados</text>
    <g font-size="12.5" opacity="0.95">
      <text x="1030" y="190">• Iceberg sobre Parquet</text>
      <text x="1030" y="216">• zstd + partição por ano</text>
      <text x="1030" y="242">• catálogo SQL (Postgres)</text>
      <text x="1030" y="268">• snapshots → rollback</text>
    </g>
  </g>

  <!-- setas -->
  <g stroke="#4a4a4a" stroke-width="2" fill="none" marker-end="url(#seta)">
    <line x1="190" y1="98" x2="255" y2="165"/>
    <line x1="190" y1="188" x2="255" y2="184"/>
    <line x1="190" y1="278" x2="255" y2="203"/>
    <line x1="380" y1="182" x2="425" y2="195"/>
    <line x1="535" y1="88" x2="535" y2="96"/>
    <line x1="710" y1="180" x2="795" y2="125"/>
    <line x1="710" y1="260" x2="795" y2="315"/>
    <line x1="950" y1="125" x2="995" y2="162"/>
    <line x1="950" y1="315" x2="995" y2="280"/>
  </g>

  <!-- latência de cada caminho -->
  <g fill="#555" font-size="11" font-style="italic">
    <text x="400" y="172">grava</text>
    <text x="722" y="145">agendado</text>
    <text x="722" y="298">segundos</text>
  </g>

  <!-- legenda -->
  <g>
    <circle cx="470" cy="442" r="6" fill="#0c3b2b"/>
    <text x="484" y="447" font-size="12.5" fill="#333">Entrega 1 — origem OLTP</text>
    <circle cx="760" cy="442" r="6" fill="#8a4b08"/>
    <text x="774" y="447" font-size="12.5" fill="#333">Entrega 2 — lakehouse (lote + CDC)</text>
  </g>
</svg>
