name: leitos

services:
  # ── PostgreSQL 16 (origem OLTP) ───────────────────────────────────
  # wal_level=logical desde a E1 para o CDC (Debezium) da E2.
  postgres:
    image: docker.io/library/postgres:16
    container_name: leitos_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leitos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leitos}
      POSTGRES_DB: ${POSTGRES_DB:-leitos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leitos} -d ${POSTGRES_DB:-leitos}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Migrações versionadas ──────────────────────────────────
  migrate:
    build: .
    container_name: leitos_migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leitos}:${POSTGRES_PASSWORD:-leitos}@postgres:5432/${POSTGRES_DB:-leitos}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:-debezium}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Carga das fontes públicas ──────────────────────────────
  # MODO=amostra usa o recorte versionado em dados/amostra (sem rede).
  # MODO=completo baixa do FTP do DATASUS as UFs e anos configurados.
  loader:
    build: .
    container_name: leitos_loader
    restart: "no"
    command: ["python", "-m", "loader"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-leitos}:${POSTGRES_PASSWORD:-leitos}@postgres:5432/${POSTGRES_DB:-leitos}
      MODO: ${MODO:-amostra}
      UFS: ${UFS:-DF,GO}
      COMPETENCIA_INICIO: ${COMPETENCIA_INICIO:-2021-01}
      COMPETENCIA_FIM: ${COMPETENCIA_FIM:-}
      DIR_BRUTOS: /dados/brutos
    volumes:
      - dados_brutos:/dados/brutos
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ══ Perfil e2: ingestão em lote e CDC até o lakehouse ══════════════
  # docker compose --profile e2 up --build
  # Sem o perfil, só sobem os serviços da E1 acima.

  # ── Armazenamento de objetos compatível com S3 ─────────────────
  # O MinIO não publica mais imagem pública; o SeaweedFS fala o mesmo protocolo.
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.01
    container_name: leitos_seaweedfs
    profiles: ["e2"]
    restart: unless-stopped
    command: ["server", "-ip.bind=0.0.0.0", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── Log de eventos (API Kafka), um único nó ──────────────────────
  redpanda:
    image: docker.io/redpandadata/redpanda:v26.2.5
    container_name: leitos_redpanda
    profiles: ["e2"]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,externo://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,externo://localhost:${KAFKA_PORT:-19092}
      - --default-log-level=warn
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── CDC: lê o WAL do PostgreSQL e publica no Redpanda ─────────────
  debezium:
    image: quay.io/debezium/server:3.6.3.Final
    container_name: leitos_debezium
    profiles: ["e2"]
    restart: unless-stopped
    environment:
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${DEBEZIUM_PASSWORD:-debezium}
      JAVA_OPTS: -Xms128m -Xmx384m
    volumes:
      - ./infra/debezium/application.properties:/debezium/config/application.properties:ro
      - debezium_data:/debezium/data
    mem_limit: 768m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

  # ── Prepara o lakehouse: buckets, catálogo Iceberg e tabelas ───────
  lakehouse-init:
    build: .
    container_name: leitos_lakehouse_init
    profiles: ["e2"]
    restart: "no"
    command: ["python", "-m", "lakehouse.preparar"]
    environment: &lakehouse_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-leitos}:${POSTGRES_PASSWORD:-leitos}@postgres:5432/${POSTGRES_DB:-leitos}
      CATALOGO_URL: postgresql+psycopg://${POSTGRES_USER:-leitos}:${POSTGRES_PASSWORD:-leitos}@postgres:5432/iceberg
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: leitos
      S3_SECRET_KEY: leitos-segredo
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy

  # ── Caminho de lote: brutos para o bucket e origem para lote.* ─────
  # Roda uma vez depois da carga; para repetir: docker compose run --rm lote
  lote:
    build: .
    container_name: leitos_lote
    profiles: ["e2"]
    restart: "no"
    command: ["python", "-m", "lakehouse.lote"]
    environment:
      <<: *lakehouse_env
      DIRS_BRUTOS: /dados/brutos:/app/dados/amostra
    volumes:
      - dados_brutos:/dados/brutos:ro
    depends_on:
      loader:
        condition: service_completed_successfully
      lakehouse-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  dados_brutos:
  seaweedfs_data:
  redpanda_data:
  debezium_data:
